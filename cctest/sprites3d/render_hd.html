<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>3D Sprite Renderer HD</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<style>
body { margin:0; background:#00FF00; overflow:hidden; }
#info { position:fixed; top:10px; left:10px; color:#fff; background:rgba(0,0,0,0.7); padding:10px; font-family:monospace; z-index:100; }
#sheet { display:block; }
</style>
</head>
<body>
<div id="info">Loading...</div>
<canvas id="sheet"></canvas>
<script>
// Get params from URL: ?hair=color&eyes=color&skin=color
const params = new URLSearchParams(window.location.search);
const hairColor = params.get('hair') || 'ff4444';
const eyeColor = params.get('eyes') || '333333';
const skinColor = params.get('skin') || 'ffffff';

const DIRS = 8;
const FRAMES = 8;
const SPRITE_W = 512, SPRITE_H = 512;  // HD!

const sheet = document.getElementById('sheet');
sheet.width = SPRITE_W * FRAMES;
sheet.height = SPRITE_H * DIRS;
const sctx = sheet.getContext('2d');
sctx.fillStyle = '#00FF00';
sctx.fillRect(0, 0, sheet.width, sheet.height);

const renderer = new THREE.WebGLRenderer({antialias:true, alpha:false});
renderer.setSize(SPRITE_W, SPRITE_H);
renderer.setClearColor(0x00FF00, 1);
document.body.appendChild(renderer.domElement);
renderer.domElement.style.position = 'fixed';
renderer.domElement.style.bottom = '10px';
renderer.domElement.style.right = '10px';
renderer.domElement.style.width = '128px';
renderer.domElement.style.height = '128px';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x00FF00);

const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);

const light1 = new THREE.DirectionalLight(0xffffff, 1.2);
light1.position.set(5, 10, 7);
scene.add(light1);
const light2 = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(light2);

let mixer, model, clip, headBone;
let currentDir = 0, currentFrame = 0;

const info = document.getElementById('info');
const GLB_URL = params.get('glb') || 'https://raw.githubusercontent.com/espil/espil-online/main/cctest/sprites3d/running.glb';

new THREE.GLTFLoader().load(GLB_URL, function(gltf) {
    model = gltf.scene;
    scene.add(model);
    
    const box = new THREE.Box3().setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    model.position.sub(center);
    
    // Find head bone
    model.traverse(function(obj) {
        if (obj.isBone && obj.name.toLowerCase().includes('head')) {
            headBone = obj;
            console.log('Found head bone:', obj.name);
        }
    });
    
    // Apply skin color tint to model materials
    const skin = new THREE.Color('#' + skinColor);
    model.traverse(function(obj) {
        if (obj.isMesh && obj.material) {
            obj.material.color.multiply(skin);
        }
    });
    
    // Add 3D hair attached to head bone (or model if no bone found)
    const hairMat = new THREE.MeshStandardMaterial({ 
        color: new THREE.Color('#' + hairColor),
        roughness: 0.6 
    });
    // Hair as a slightly larger sphere on top of head
    const hairGeo = new THREE.SphereGeometry(0.32, 24, 18);
    const hair = new THREE.Mesh(hairGeo, hairMat);
    hair.scale.set(1.1, 0.9, 1.05);
    hair.position.set(0, 0.15, -0.02);
    
    // Add 3D eyes
    const eyeMat = new THREE.MeshStandardMaterial({ 
        color: new THREE.Color('#' + eyeColor),
        roughness: 0.3 
    });
    const eyeGeo = new THREE.SphereGeometry(0.045, 16, 12);
    const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
    const eyeR = new THREE.Mesh(eyeGeo, eyeMat);
    eyeL.position.set(-0.11, 0.02, 0.26);
    eyeR.position.set(0.11, 0.02, 0.26);
    
    const headGroup = new THREE.Group();
    headGroup.add(hair);
    headGroup.add(eyeL);
    headGroup.add(eyeR);
    
    if (headBone) {
        headBone.add(headGroup);
        // Position relative to head bone (head bone origin is at neck)
        headGroup.position.set(0, 0.25, 0);
    } else {
        // Fallback: attach to model at estimated head position
        headGroup.position.set(0, 1.1, 0);
        model.add(headGroup);
    }
    
    if (gltf.animations.length > 0) {
        clip = gltf.animations[0];
        mixer = new THREE.AnimationMixer(model);
        const action = mixer.clipAction(clip);
        action.play();
        info.textContent = 'Animation: ' + clip.name + ', duration: ' + clip.duration.toFixed(2) + 's';
    } else {
        clip = { duration: 1 };
        info.textContent = 'No animation - static pose';
    }
    
    setTimeout(renderAll, 1000);
}, undefined, function(e) {
    info.textContent = 'Error: ' + e.message;
});

function renderAll() {
    if (currentDir >= DIRS) {
        info.textContent = 'DONE! Right-click sheet -> Save image';
        renderer.domElement.style.display = 'none';
        return;
    }
    
    const angle = (currentDir / DIRS) * Math.PI * 2;
    const radius = 9;
    camera.position.set(Math.sin(angle) * radius, 1.5, Math.cos(angle) * radius);
    camera.lookAt(0, 0.0, 0);
    
    if (mixer && clip.duration > 1) {
        const t = (currentFrame / FRAMES) * clip.duration;
        mixer.setTime(t);
        mixer.update(0);
    }
    
    renderer.render(scene, camera);
    sctx.drawImage(renderer.domElement, currentFrame * SPRITE_W, currentDir * SPRITE_H, SPRITE_W, SPRITE_H);
    
    sctx.fillStyle = '#fff';
    sctx.font = '20px monospace';
    const dirNames = ['S','SE','E','NE','N','NW','W','SW'];
    sctx.fillText(dirNames[currentDir] + '-' + currentFrame, currentFrame*SPRITE_W+8, currentDir*SPRITE_H+28);
    
    info.textContent = `Rendering HD: dir ${currentDir+1}/${DIRS}, frame ${currentFrame+1}/${FRAMES}`;
    
    currentFrame++;
    if (currentFrame >= FRAMES) {
        currentFrame = 0;
        currentDir++;
    }
    
    setTimeout(renderAll, 50);
}
</script>
</body>
</html>
