<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D 캐릭터 커스텀</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:sans-serif; background:#1a1a2e; color:#eee; overflow:hidden; }
  #app { display:flex; height:100vh; }
  #stage { flex:1; position:relative; overflow:hidden; background:#2a2a3e; }
  #c3d { width:100%; height:100%; display:block; }
  #nametag {
    position:absolute; top:14px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,0.55); color:#fff; padding:6px 18px; border-radius:14px;
    font-size:15px; font-weight:bold; z-index:10; pointer-events:none;
  }
  #hint {
    position:absolute; bottom:14px; left:50%; transform:translateX(-50%);
    color:#888; font-size:12px; z-index:10; pointer-events:none;
  }
  #panel {
    width:300px; background:rgba(20,20,35,0.95);
    border-left:1px solid rgba(255,255,255,0.1);
    display:flex; flex-direction:column; z-index:10;
  }
  #tabs { display:flex; border-bottom:1px solid rgba(255,255,255,0.1); }
  #tabs button {
    flex:1; background:none; border:none; color:#888; padding:14px;
    font-size:14px; cursor:pointer; border-bottom:2px solid transparent;
  }
  #tabs button.active { color:#fff; border-bottom-color:#0e6e6e; }
  #tab-content { flex:1; overflow-y:auto; padding:12px; }
  .section-label { font-size:12px; color:#888; margin:12px 0 8px; }
  .section-label:first-child { margin-top:0; }
  .style-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .style-btn {
    background:rgba(255,255,255,0.07); border:2px solid transparent; border-radius:10px;
    padding:8px 4px; cursor:pointer; color:#ddd; font-size:11px; text-align:center;
  }
  .style-btn.active { border-color:#0e6e6e; background:rgba(14,110,110,0.25); }
  .color-swatch { width:100%; height:32px; border-radius:6px; margin-bottom:4px; border:1px solid rgba(255,255,255,0.2); }
  @media (max-width:640px) {
    #panel { width:200px; }
    .style-grid { grid-template-columns:repeat(3,1fr); }
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="nametag">Espil</div>
    <canvas id="c3d"></canvas>
    <div id="hint">드래그하여 회전</div>
  </div>
  <div id="panel">
    <div id="tabs">
      <button data-tab="hair" class="active">헤어</button>
      <button data-tab="eyes">눈</button>
      <button data-tab="skin">피부</button>
    </div>
    <div id="tab-content">
      <div id="tab-hair">
        <div class="section-label">스타일</div>
        <div class="style-grid" id="hair-style"></div>
        <div class="section-label">색상</div>
        <div class="style-grid" id="hair-color"></div>
      </div>
      <div id="tab-eyes" style="display:none;">
        <div class="section-label">색상</div>
        <div class="style-grid" id="eye-color"></div>
      </div>
      <div id="tab-skin" style="display:none;">
        <div class="section-label">피부색</div>
        <div class="style-grid" id="skin-color"></div>
      </div>
    </div>
  </div>
</div>
<script>
// 3D Character Customizer
const canvas = document.getElementById('c3d');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2a2a3e);

const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
camera.position.set(0, 1.2, 4);
camera.lookAt(0, 0.8, 0);

const light1 = new THREE.DirectionalLight(0xffffff, 1.2);
light1.position.set(5, 10, 7);
scene.add(light1);
scene.add(new THREE.AmbientLight(0xffffff, 0.6));

// Rotation control
let rotY = 0, targetRotY = 0;
let isDragging = false, lastX = 0;
canvas.addEventListener('pointerdown', e => { isDragging = true; lastX = e.clientX; });
window.addEventListener('pointermove', e => {
  if (isDragging) { targetRotY += (e.clientX - lastX) * 0.01; lastX = e.clientX; }
});
window.addEventListener('pointerup', () => isDragging = false);

let model, headBone, hairMesh, eyeL, eyeR;
let curHairStyle = 'bob', curHairColor = 'ff4444', curEyeColor = '333333', curSkin = 'ffffff';

const HAIR_COLORS = {
  black:'222222', brown:'6b4226', blonde:'f5d76e', red:'ff4444',
  orange:'ff8833', pink:'ff99cc', blue:'4499ff', green:'44dd77',
  purple:'aa66ff', white:'eeeeee', silver:'aaccdd', teal:'44ddcc',
};
const EYE_COLORS = {
  black:'222222', brown:'6b4226', blue:'4499ff', green:'44dd77',
  red:'ff4444', purple:'aa66ff', pink:'ff99cc', amber:'ffaa33',
};
const SKINS = {
  white:'ffffff', light:'ffdcb4', medium:'e6b48c', tan:'c8966e',
  brown:'966846', dark:'643c32', blue:'96c8ff', green:'96e696',
  pink:'ffb4c8', purple:'c896ff',
};
const HAIR_STYLES = {
  bob:'단발', long:'긴생머리', spiky:'스파이키', twintail:'트윈테일', buzz:'버즈컷',
};

function buildHair(style, color) {
  if (hairMesh) headBone.remove(hairMesh);
  const mat = new THREE.MeshStandardMaterial({ color:new THREE.Color('#'+color), roughness:0.6 });
  let geo;
  switch(style) {
    case 'long':
      geo = new THREE.SphereGeometry(0.34, 24, 18);
      hairMesh = new THREE.Mesh(geo, mat);
      hairMesh.scale.set(1.05, 1.3, 1.0);
      hairMesh.position.set(0, 0.22, -0.1);
      break;
    case 'spiky':
      geo = new THREE.ConeGeometry(0.3, 0.5, 8);
      hairMesh = new THREE.Mesh(geo, mat);
      hairMesh.position.set(0, 0.45, -0.05);
      break;
    case 'twintail':
      // Main cap + two tails
      const group = new THREE.Group();
      const cap = new THREE.Mesh(new THREE.SphereGeometry(0.32, 24, 18), mat);
      cap.scale.set(1.15, 1.0, 1.1);
      cap.position.set(0, 0.28, -0.08);
      group.add(cap);
      const tailGeo = new THREE.ConeGeometry(0.12, 0.5, 12);
      const tailL = new THREE.Mesh(tailGeo, mat);
      tailL.position.set(-0.35, 0.15, -0.15);
      tailL.rotation.z = 0.4;
      const tailR = new THREE.Mesh(tailGeo, mat);
      tailR.position.set(0.35, 0.15, -0.15);
      tailR.rotation.z = -0.4;
      group.add(tailL); group.add(tailR);
      hairMesh = group;
      break;
    case 'buzz':
      geo = new THREE.SphereGeometry(0.3, 24, 18);
      hairMesh = new THREE.Mesh(geo, mat);
      hairMesh.scale.set(1.05, 0.8, 1.02);
      hairMesh.position.set(0, 0.3, -0.08);
      break;
    default: // bob
      geo = new THREE.SphereGeometry(0.32, 24, 18);
      hairMesh = new THREE.Mesh(geo, mat);
      hairMesh.scale.set(1.15, 1.0, 1.1);
      hairMesh.position.set(0, 0.28, -0.08);
  }
  if (headBone) headBone.add(hairMesh);
  else model.add(hairMesh);
}

new THREE.GLTFLoader().load(
  'https://raw.githubusercontent.com/espil/espil-online/main/cctest/sprites3d/running.glb',
  function(gltf) {
    model = gltf.scene;
    scene.add(model);
    const box = new THREE.Box3().setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    model.position.sub(center);
    
    model.traverse(o => {
      if (o.isBone && o.name.toLowerCase().includes('head')) headBone = o;
    });
    
    // Eyes
    const eyeMat = new THREE.MeshStandardMaterial({ color:new THREE.Color('#'+curEyeColor), roughness:0.3 });
    const eyeGeo = new THREE.SphereGeometry(0.045, 16, 12);
    eyeL = new THREE.Mesh(eyeGeo, eyeMat);
    eyeR = new THREE.Mesh(eyeGeo, eyeMat);
    eyeL.position.set(-0.11, 0.02, 0.26);
    eyeR.position.set(0.11, 0.02, 0.26);
    
    const eyeGroup = new THREE.Group();
    eyeGroup.add(eyeL); eyeGroup.add(eyeR);
    eyeGroup.position.set(0, 0.25, 0);
    if (headBone) headBone.add(eyeGroup);
    
    buildHair(curHairStyle, curHairColor);
    applySkin(curSkin);
    
    // Idle animation or static
    if (gltf.animations.length > 0) {
      const mixer = new THREE.AnimationMixer(model);
      mixer.clipAction(gltf.animations[0]).play();
      // Gentle idle: pause at a neutral frame
      mixer.setTime(0.1);
      mixer.update(0);
    }
    
    buildUI();
    animate();
  }
);

function applySkin(color) {
  curSkin = color;
  if (!model) return;
  const skin = new THREE.Color('#' + color);
  model.traverse(o => {
    if (o.isMesh && o.material && o.material.color) {
      // Only tint the body (not hair/eyes which have their own materials)
      if (o !== hairMesh && o !== eyeL && o !== eyeR) {
        o.material.color.set('#ffffff').multiply(skin);
      }
    }
  });
}

function buildUI() {
  const $ = id => document.getElementById(id);
  
  // Hair styles
  const hsEl = $('hair-style'); hsEl.innerHTML = '';
  for (const [k, name] of Object.entries(HAIR_STYLES)) {
    const b = document.createElement('div');
    b.className = 'style-btn' + (k === curHairStyle ? ' active' : '');
    b.innerHTML = `<div>${name}</div>`;
    b.onclick = () => { curHairStyle = k; buildHair(k, curHairColor); buildUI(); };
    hsEl.appendChild(b);
  }
  
  // Hair colors
  const hcEl = $('hair-color'); hcEl.innerHTML = '';
  for (const [name, hex] of Object.entries(HAIR_COLORS)) {
    const b = document.createElement('div');
    b.className = 'style-btn' + (hex === curHairColor ? ' active' : '');
    b.innerHTML = `<div class="color-swatch" style="background:#${hex}"></div>`;
    b.onclick = () => { curHairColor = hex; buildHair(curHairStyle, hex); buildUI(); };
    hcEl.appendChild(b);
  }
  
  // Eye colors
  const ecEl = $('eye-color'); ecEl.innerHTML = '';
  for (const [name, hex] of Object.entries(EYE_COLORS)) {
    const b = document.createElement('div');
    b.className = 'style-btn' + (hex === curEyeColor ? ' active' : '');
    b.innerHTML = `<div class="color-swatch" style="background:#${hex}"></div>`;
    b.onclick = () => {
      curEyeColor = hex;
      const c = new THREE.Color('#' + hex);
      eyeL.material.color.set(c); eyeR.material.color.set(c);
      buildUI();
    };
    ecEl.appendChild(b);
  }
  
  // Skin colors
  const scEl = $('skin-color'); scEl.innerHTML = '';
  for (const [name, hex] of Object.entries(SKINS)) {
    const b = document.createElement('div');
    b.className = 'style-btn' + (hex === curSkin ? ' active' : '');
    b.innerHTML = `<div class="color-swatch" style="background:#${hex}"></div><div>${name}</div>`;
    b.onclick = () => { applySkin(hex); buildUI(); };
    scEl.appendChild(b);
  }
  
  // Tabs
  document.querySelectorAll('#tabs button').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('#tabs button').forEach(x => x.classList.remove('active'));
      btn.classList.add('active');
      for (const t of ['hair', 'eyes', 'skin']) {
        $('tab-' + t).style.display = btn.dataset.tab === t ? '' : 'none';
      }
    };
  });
}

function resize() {
  const stage = document.getElementById('stage');
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);

function animate() {
  requestAnimationFrame(animate);
  resize();
  rotY += (targetRotY - rotY) * 0.1;
  if (model) model.rotation.y = rotY;
  // Gentle bob
  if (model) model.position.y = Math.sin(Date.now() / 1000 * 2) * 0.03;
  renderer.render(scene, camera);
}
</script>
</body>
</html>
