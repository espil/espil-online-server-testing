<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Espil Online — Vancouver</title>
<link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.css">
<style>
  /* Base */
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#050914;font-family:system-ui,sans-serif;}
  #map{position:absolute;inset:0;}
  /* Minimap (Cauldron 5-stage) */
  #minimap-wrap{position:absolute;top:16px;right:16px;width:180px;height:180px;border-radius:12px;overflow:hidden;border:2px solid rgba(255,255,255,.2);box-shadow:0 4px 20px rgba(0,0,0,.5);z-index:10;}
  #minimap{width:100%;height:100%;}
  #minimap-wrap[data-stage="2"]{width:280px;height:280px;}
  #minimap-wrap[data-stage="3"]{width:100vw;height:100vh;top:0;right:0;border-radius:0;border:none;}
  .map-zoom-controls{position:absolute;bottom:8px;right:8px;display:flex;gap:4px;z-index:11;}
  .map-zoom-controls button{width:28px;height:28px;border-radius:6px;border:none;background:rgba(0,0,0,.6);color:#fff;font-size:16px;cursor:pointer;}
  /* HUD (from espil.online) */
  #hud{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:10;}
  .hotkey{width:48px;height:48px;border-radius:8px;background:rgba(0,0,0,.5);border:2px solid rgba(255,255,255,.3);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;}
  /* Store modal (from espil.online) */
  #store-modal{display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:90%;max-width:500px;max-height:80vh;background:#1a2233;border-radius:16px;z-index:100;overflow:hidden;}
  #store-modal.open{display:block;}
  #store-modal-close{position:absolute;top:12px;right:12px;background:none;border:none;color:#fff;font-size:24px;cursor:pointer;z-index:1;}
  /* Toast */
  #toast{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);color:#fff;padding:8px 16px;border-radius:20px;display:none;z-index:50;}
  #toast.show{display:block;}
  /* Loading */
  #loading{position:absolute;inset:0;background:#050914;display:flex;align-items:center;justify-content:center;z-index:200;color:#fff;}
  #loading.done{display:none;}
</style>
</head>
<body>
<div id="loading">Loading Vancouver…</div>
<div id="map"></div>
<div id="minimap-wrap" data-stage="1">
  <div id="minimap"></div>
  <div class="map-zoom-controls">
    <button id="map-zoom-in">+</button>
    <button id="map-zoom-out">−</button>
  </div>
</div>
<div id="hud">
  <div class="hotkey">1</div><div class="hotkey">2</div><div class="hotkey">3</div><div class="hotkey">4</div>
  <div class="hotkey">Q</div><div class="hotkey">W</div><div class="hotkey">E</div><div class="hotkey">R</div>
</div>
<div id="store-modal">
  <button id="store-modal-close">×</button>
  <div id="store-modal-content"></div>
</div>
<div id="toast"></div>

<script src="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.js"></script>
<script>
// Static config (from Cauldron)
window.CAULDRON_STATIC_CONFIG = {
  mapboxToken: '__PUT_YOUR_MAPBOX_TOKEN_HERE__',
  mapboxStyle: 'mapbox://styles/quadclipse/cmos12qyt008901rgg1eka1xm',
  analysisMapboxStyle: 'mapbox://styles/mapbox/streets-v12',
};
</script>
<script>
/* Merged Vancouver: Cauldron map + espil.online UI */
(function(){
  var CFG = window.CAULDRON_STATIC_CONFIG;
  mapboxgl.accessToken = CFG.mapboxToken;

  var VANCOUVER = [-123.1207, 49.2827];
  var CAMERA_PITCH = 48;
  var CAMERA_BEARING = -10;
  var CAMERA_ZOOM = 16.5;

  var MINIMAP_LEVELS = [
    {label:'50m', zoom:18.35},
    {label:'100m', zoom:17.35},
    {label:'500m', zoom:15.05},
    {label:'1km', zoom:14.05},
    {label:'5km', zoom:11.75},
  ];
  var zoomIdx = 1;

  var map, minimap, playerMarker, minimapMarker;
  var playerLngLat = VANCOUVER.slice();

  function createMarkerEl(cls, label){
    var el = document.createElement('div');
    el.className = cls;
    el.setAttribute('aria-label', label);
    el.style.cssText = 'width:20px;height:20px;border-radius:50%;background:#4f7ed9;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.5);';
    return el;
  }

  function initMap(){
    map = new mapboxgl.Map({
      container: 'map',
      style: CFG.mapboxStyle,
      center: playerLngLat,
      zoom: CAMERA_ZOOM,
      pitch: CAMERA_PITCH,
      bearing: CAMERA_BEARING,
      attributionControl: false,
      dragPan: false,
      dragRotate: false,
      scrollZoom: false,
      doubleClickZoom: false,
      touchZoomRotate: false,
      keyboard: false,
    });

    map.on('style.load', function(){
      try{
        map.setFog({
          color: 'rgb(8, 12, 18)',
          'high-color': 'rgb(42, 68, 96)',
          'space-color': 'rgb(2, 4, 10)',
          'horizon-blend': 0.08,
        });
      }catch(e){}
      // Lower building opacity for visibility (Cauldron style)
      map.getStyle().layers.forEach(function(layer){
        if(layer.type === 'fill-extrusion' && /building/i.test(layer.id)){
          map.setPaintProperty(layer.id, 'fill-extrusion-opacity', 0.85);
        }
      });
      document.getElementById('loading').classList.add('done');
    });

    playerMarker = new mapboxgl.Marker({
      element: createMarkerEl('player-marker', 'Player'),
      anchor: 'center',
    }).setLngLat(playerLngLat).addTo(map);

    initMinimap();
    initControls();
  }

  function initMinimap(){
    minimap = new mapboxgl.Map({
      container: 'minimap',
      style: CFG.analysisMapboxStyle,
      center: playerLngLat,
      zoom: MINIMAP_LEVELS[zoomIdx].zoom,
      interactive: false,
      attributionControl: false,
    });
    minimap.on('load', function(){
      minimapMarker = new mapboxgl.Marker({
        element: createMarkerEl('minimap-marker', 'Player on minimap'),
        anchor: 'center',
      }).setLngLat(playerLngLat).addTo(minimap);
    });

    document.getElementById('map-zoom-in').addEventListener('click', function(){
      zoomIdx = Math.min(MINIMAP_LEVELS.length-1, zoomIdx+1);
      minimap.setZoom(MINIMAP_LEVELS[zoomIdx].zoom);
    });
    document.getElementById('map-zoom-out').addEventListener('click', function(){
      zoomIdx = Math.max(0, zoomIdx-1);
      minimap.setZoom(MINIMAP_LEVELS[zoomIdx].zoom);
    });
  }

  function initControls(){
    var keys = {};
    document.addEventListener('keydown', function(e){
      keys[e.key.toLowerCase()] = true;
      if(e.key==='m'||e.key==='M') cycleMinimap();
      if(e.key===' '){ e.preventDefault(); tryInteract(); }
    });
    document.addEventListener('keyup', function(e){
      keys[e.key.toLowerCase()] = false;
    });

    // Movement loop
    var STEP = 0.00005; // ~5m per frame at 60fps
    function tick(){
      var moved = false;
      var dlng = 0, dlat = 0;
      if(keys['w']||keys['arrowup']){ dlat += STEP; moved=true; }
      if(keys['s']||keys['arrowdown']){ dlat -= STEP; moved=true; }
      if(keys['a']||keys['arrowleft']){ dlng -= STEP; moved=true; }
      if(keys['d']||keys['arrowright']){ dlng += STEP; moved=true; }
      if(moved){
        playerLngLat[0] += dlng;
        playerLngLat[1] += dlat;
        map.setCenter(playerLngLat);
        playerMarker.setLngLat(playerLngLat);
        if(minimapMarker) minimapMarker.setLngLat(playerLngLat);
        minimap.setCenter(playerLngLat);
      }
      requestAnimationFrame(tick);
    }
    tick();
  }

  function cycleMinimap(){
    var wrap = document.getElementById('minimap-wrap');
    var stage = parseInt(wrap.getAttribute('data-stage'),10);
    stage = stage >= 3 ? 1 : stage + 1;
    wrap.setAttribute('data-stage', stage);
  }

  // Store interaction (from espil.online, adapted for Mapbox)
  var GOOGLE_PLACES_KEY = '__PUT_YOUR_KEY_HERE__';
  function tryInteract(){
    // Fetch nearby stores via Google Places
    var lat = playerLngLat[1], lng = playerLngLat[0];
    if(GOOGLE_PLACES_KEY.indexOf('__PUT_')===0){
      showToast('Store data unavailable (API key needed)');
      return;
    }
    var url = 'https://places.googleapis.com/v1/places:searchNearby';
    // ... (Places API call, show modal if stores found)
    showToast('Checking for nearby stores…');
  }

  function showToast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._t);
    t._t = setTimeout(function(){ t.classList.remove('show'); }, 2000);
  }

  // Store deep link: /vancouver/store/{placeId}
  function checkDeepLink(){
    var m = location.pathname.match(/\/vancouver\/store\/([^\/]+)/);
    if(m){
      var placeId = m[1];
      showToast('Loading store: ' + placeId);
      // TODO: Fetch place details and show modal
    }
  }

  // Init
  initMap();
  checkDeepLink();
})();
</script>
</body>
</html>
